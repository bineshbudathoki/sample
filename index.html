<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Image Slider</title>
</head>
<body>
    <main class="slider" aria-label="Photo slider">
        <div class="slider-track">
            <div class="slide"><img src="images.jpg" alt="A pink tree in a lavender field"></div>
            <div class="slide"><img src="images%20(1).jpg" alt="A lobster wearing a reflective vest and boots"></div>
            <div class="slide"><img src="random.jpg" alt="An elephant standing against a blue background"></div>
        </div>
        <button class="slider-btn prev" type="button" aria-label="Previous slide">&#10094;</button>
        <button class="slider-btn next" type="button" aria-label="Next slide">&#10095;</button>
        <div class="slider-indicators" role="group" aria-label="Choose a slide"></div>
    </main>
</body>
</html>
